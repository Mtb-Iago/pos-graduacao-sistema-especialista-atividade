<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1140" width="940" height="1140" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Marcadores de Seta -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#334155" />
    </marker>
    <marker id="arrowDash" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#475569" />
    </marker>
  </defs>

  <!-- Cabeçalho Técnico -->
  <rect x="30" y="20" width="880" height="52" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2" />
  <text x="50" y="43" font-size="14" font-weight="700" fill="#0f172a">MTBExpert — Fluxograma Arquitetural do Sistema Especialista</text>
  <text x="50" y="60" font-size="11" fill="#475569">Pipeline determinístico com Guardrail de Escopo, Cache Semântico Vetorial e Ferramentas MCP</text>

  <!-- 1. INÍCIO (Terminal) -->
  <rect x="330" y="94" width="280" height="46" rx="23" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
  <text x="470" y="115" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Início: Pergunta Recebida no Chat</text>
  <text x="470" y="130" font-size="10" fill="#475569" text-anchor="middle">Usuário envia dúvida ou consulta sobre a competição</text>

  <!-- Conector Início -> Decisão 1 -->
  <line x1="470" y1="140" x2="470" y2="175" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. DECISÃO 1: Guardrail de Domínio / Escopo -->
  <polygon points="470,175 640,225 470,275 300,225" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
  <text x="470" y="213" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle">[GUARDRAIL DE ESCOPO]</text>
  <text x="470" y="230" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">A pergunta pertence ao escopo</text>
  <text x="470" y="246" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">de Mountain Bike e da prova?</text>

  <!-- Ramo [Não] -> Bloqueio de Escopo -->
  <line x1="640" y1="225" x2="725" y2="225" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="655" y="210" width="46" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="678" y="223" font-size="10" font-weight="700" fill="#475569" text-anchor="middle">Não</text>

  <rect x="725" y="196" width="185" height="58" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" />
  <text x="817" y="217" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Bloqueio de Escopo</text>
  <text x="817" y="232" font-size="9.5" fill="#475569" text-anchor="middle">Recusa padronizada (&lt;5ms)</text>
  <text x="817" y="245" font-size="9.5" fill="#475569" text-anchor="middle">Sem custo de IA ou tokens</text>

  <!-- Conector Bloqueio -> Fim 1 -->
  <line x1="817" y1="254" x2="817" y2="288" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="737" y="288" width="160" height="34" rx="17" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" />
  <text x="817" y="309" font-size="10.5" font-weight="700" fill="#334155" text-anchor="middle">Atendimento Encerrado</text>

  <!-- Ramo [Sim] -> Decisão 2 -->
  <line x1="470" y1="275" x2="470" y2="330" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="478" y="292" width="40" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="498" y="305" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Sim</text>

  <!-- 3. DECISÃO 2: Cache Semântico Vetorial (Busca) -->
  <polygon points="470,330 645,385 470,440 295,385" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
  <text x="470" y="371" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle">[CACHE SEMÂNTICO VETORIAL]</text>
  <text x="470" y="388" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">A dúvida possui resposta canônica</text>
  <text x="470" y="404" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">já armazenada no banco vetorial?</text>

  <!-- Ramo [Sim] -> Resposta do Cache Semântico -->
  <line x1="295" y1="385" x2="205" y2="385" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="230" y="370" width="40" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="250" y="383" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Sim</text>

  <rect x="30" y="356" width="175" height="58" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.2" />
  <text x="117" y="378" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">Cache Semântico (Hit)</text>
  <text x="117" y="393" font-size="9.5" fill="#475569" text-anchor="middle">Retorno oficial em ~20ms</text>
  <text x="117" y="406" font-size="9.5" fill="#475569" text-anchor="middle">Sem alucinação nem consumo</text>

  <!-- Linha tracejada do Cache Semântico direto para a Entrega -->
  <path d="M 117 414 L 117 952 L 295 952" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowDash)" />
  <rect x="130" y="650" width="135" height="20" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="197" y="664" font-size="9" fill="#475569" text-anchor="middle">Retorno direto do regulamento</text>

  <!-- Ramo [Não] -> Orquestrador Especialista -->
  <line x1="470" y1="440" x2="470" y2="485" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="478" y="452" width="40" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="498" y="465" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Não</text>

  <!-- 4. ETAPA: Orquestrador Especialista -->
  <rect x="305" y="485" width="330" height="52" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
  <text x="470" y="507" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Orquestrador Especialista (NestJS)</text>
  <text x="470" y="523" font-size="10" fill="#475569" text-anchor="middle">Injeta persona do comissário, regulamento oficial e histórico</text>

  <!-- Conector -> Decisão 3 -->
  <line x1="470" y1="537" x2="470" y2="575" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 5. DECISÃO 3: Necessidade de Ferramentas MCP -->
  <polygon points="470,575 645,630 470,685 295,630" fill="#ffffff" stroke="#334155" stroke-width="1.5" />
  <text x="470" y="616" font-size="10.5" font-weight="700" fill="#64748b" text-anchor="middle">[FERRAMENTAS MCP]</text>
  <text x="470" y="633" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Requer consulta a dados ao vivo</text>
  <text x="470" y="649" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">ou auditoria cadastral da prova?</text>

  <!-- Ramo [Sim] -> Servidor MCP -->
  <line x1="645" y1="630" x2="715" y2="630" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="655" y="615" width="40" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="675" y="628" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Sim</text>

  <!-- Bloco Servidor MCP e Ferramentas Tipadas -->
  <rect x="715" y="565" width="195" height="130" rx="4" fill="#f8fafc" stroke="#475569" stroke-width="1.2" />
  <rect x="715" y="565" width="195" height="24" rx="4" fill="#e2e8f0" />
  <text x="812" y="581" font-size="10.5" font-weight="700" fill="#0f172a" text-anchor="middle">Servidor MCP (9 Ferramentas)</text>
  <text x="725" y="605" font-size="9" fill="#334155">• get_atletas / get_atleta_info</text>
  <text x="725" y="621" font-size="9.5" fill="#334155">• get_resultados / get_rankings</text>
  <text x="725" y="637" font-size="9.5" fill="#334155">• auditar_atleta / verificar_elegibilidade</text>
  <text x="725" y="653" font-size="9.5" fill="#334155">• get_categorias / get_ranking_cat</text>
  <text x="725" y="675" font-size="9" font-weight="600" fill="#475569">→ Consulta microsserviços REST</text>

  <!-- Linha tracejada de retorno das ferramentas MCP para o Orquestrador -->
  <path d="M 812 565 L 812 511 L 635 511" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowDash)" />
  <rect x="655" y="502" width="130" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="720" y="514" font-size="9" fill="#475569" text-anchor="middle">Retorno tipado via MCP</text>

  <!-- Ramo [Não] -> Inferência LLM -->
  <line x1="470" y1="685" x2="470" y2="735" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />
  <rect x="478" y="698" width="40" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="498" y="711" font-size="10" font-weight="700" fill="#334155" text-anchor="middle">Não</text>

  <!-- 6. ETAPA: Síntese e Raciocínio (LLM Especialista) -->
  <rect x="305" y="735" width="330" height="52" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
  <text x="470" y="757" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Raciocínio e Síntese (LLM Especialista)</text>
  <text x="470" y="773" font-size="10" fill="#475569" text-anchor="middle">Redige o parecer técnico fundamentado nas regras e dados da prova</text>

  <!-- Conector -> Gravação no Cache -->
  <line x1="470" y1="787" x2="470" y2="825" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 7. ETAPA: Gravação no Cache Semântico (pgvector) -->
  <rect x="295" y="825" width="350" height="54" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
  <text x="470" y="846" font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle">Gravação no Cache Semântico (pgvector)</text>
  <text x="470" y="862" font-size="9.5" fill="#475569" text-anchor="middle">Indexa a nova regra no banco se NÃO usou dados ao vivo</text>
  <text x="470" y="873" font-size="9" fill="#64748b" text-anchor="middle">(Garante auto-aprendizado para futuras consultas)</text>

  <!-- Linha tracejada de indexação no banco de cache -->
  <path d="M 295 852 L 210 852 L 210 395 L 205 395" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrowDash)" />
  <rect x="150" y="520" width="120" height="18" rx="3" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="210" y="532" font-size="8.5" fill="#475569" text-anchor="middle">Auto-aprendizado (pgvector)</text>

  <!-- Conector -> Apresentação -->
  <line x1="470" y1="879" x2="470" y2="925" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 8. ETAPA: Exibição no Chat com Badges de Origem -->
  <rect x="295" y="925" width="350" height="54" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.5" />
  <text x="470" y="947" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Apresentação da Resposta no Chat</text>
  <text x="470" y="963" font-size="10" fill="#475569" text-anchor="middle">Exibe parecer com badges de transparência (Origem, Latência e Tools)</text>

  <!-- Conector -> Fim -->
  <line x1="470" y1="979" x2="470" y2="1025" stroke="#334155" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 9. FIM (Terminal) -->
  <rect x="360" y="1025" width="220" height="42" rx="21" fill="#f1f5f9" stroke="#334155" stroke-width="1.5" />
  <text x="470" y="1047" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Fim do Atendimento</text>
  <text x="470" y="1060" font-size="9.5" fill="#475569" text-anchor="middle">Sessão pronta para nova pergunta</text>

  <!-- Rodapé / Legenda Técnica -->
  <rect x="30" y="1090" width="880" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="470" y="1109" font-size="10" fill="#64748b" text-anchor="middle">Convenção: [Losangos] = Pontos de Decisão e Guardrails | [Retângulos] = Etapas de Processamento | [Pílulas] = Início/Fim | [Tracejadas] = Fluxo de Dados MCP e Cache</text>
</svg>
